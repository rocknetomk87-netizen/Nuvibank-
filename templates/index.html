<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NUVIBANK V10</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{

            background:#07006b;
            color:white;
            padding:30px;
        }

        h1{
            font-size:60px;
            margin-bottom:20px;
        }

        .logo{
            font-size:80px;
            margin-bottom:20px;
        }

        .card{

            background:rgba(255,255,255,0.15);

            padding:30px;

            border-radius:30px;

            margin-bottom:30px;
        }

        h2{
            font-size:50px;
            margin-bottom:25px;
        }

        input{

            width:100%;

            padding:25px;

            border:none;

            border-radius:25px;

            margin-bottom:20px;

            font-size:28px;

            background:rgba(255,255,255,0.3);

            color:white;
        }

        input::placeholder{
            color:#d9d9d9;
        }

        button{

            width:100%;

            padding:25px;

            border:none;

            border-radius:40px;

            font-size:32px;

            font-weight:bold;

            color:white;

            background:linear-gradient(
                90deg,
                #8a2be2,
                #ff3ea5
            );

            cursor:pointer;
        }

        p{
            font-size:28px;
            margin-bottom:10px;
        }

        small{
            font-size:20px;
            opacity:0.8;
        }

        #history div{

            padding:20px;

            border-radius:20px;

            margin-top:15px;

            background:rgba(255,255,255,0.1);
        }

    </style>

</head>

<body>

    <div class="logo">🏦</div>

    <h1>NUVIBANK V10</h1>

    <div class="card">

        <h2>Servidor Online</h2>

        <p>Sistema financeiro operacional.</p>

    </div>


    <!-- REGISTER -->

    <div class="card">

        <h2>Criar Conta</h2>

        <input
            type="text"
            id="register_username"
            placeholder="Nome">

        <input
            type="password"
            id="register_password"
            placeholder="Password">

        <button onclick="register()">
            Criar Conta
        </button>

    </div>


    <!-- LOGIN -->

    <div class="card">

        <h2>Login</h2>

        <input
            type="text"
            id="login_username"
            placeholder="Nome">

        <input
            type="password"
            id="login_password"
            placeholder="Password">

        <button onclick="login()">
            Entrar
        </button>

    </div>


    <!-- ACCOUNT -->

    <div class="card">

        <h2>Conta</h2>

        <div id="account_info">

            <p>Nenhum utilizador conectado</p>

        </div>

    </div>


    <!-- TRANSFER -->

    <div class="card">

        <h2>Transferir</h2>

        <input
            type="text"
            id="receiver"
            placeholder="Destinatário">

        <input
            type="number"
            id="amount"
            placeholder="Valor">

        <button onclick="transfer()">
            Transferir
        </button>

    </div>


    <!-- HISTORY -->

    <div class="card">

        <h2>Histórico</h2>

        <div id="history">

            <p>Sem transações</p>

        </div>

    </div>


    <script>

        let TOKEN = "";


        // =====================================
        // REGISTER
        // =====================================

        async function register() {

            const username =
                document.getElementById(
                    "register_username"
                ).value;

            const password =
                document.getElementById(
                    "register_password"
                ).value;

            const response = await fetch(
                "/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

            const data =
                await response.json();

            if(response.ok){

                alert(data.message);

            }else{

                alert(data.error);
            }
        }


        // =====================================
        // LOGIN
        // =====================================

        async function login() {

            const username =
                document.getElementById(
                    "login_username"
                ).value;

            const password =
                document.getElementById(
                    "login_password"
                ).value;

            const response = await fetch(
                "/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

            const data =
                await response.json();

            if(response.ok){

                TOKEN = data.token;

                alert("Login realizado");

                loadBalance();
                loadHistory();

            }else{

                alert(data.error);
            }
        }


        // =====================================
        // BALANCE
        // =====================================

        async function loadBalance() {

            const response = await fetch(
                "/balance",
                {
                    headers:{
                        "Authorization":
                            TOKEN
                    }
                }
            );

            const data =
                await response.json();

            if(response.ok){

                document.getElementById(
                    "account_info"
                ).innerHTML = `
                    <p>
                        <strong>
                            ${data.username}
                        </strong>
                    </p>

                    <p>
                        Saldo:
                        ${data.balance} AKZ
                    </p>
                `;
            }
        }


        // =====================================
        // TRANSFER
        // =====================================

        async function transfer() {

            const receiver =
                document.getElementById(
                    "receiver"
                ).value;

            const amount =
                document.getElementById(
                    "amount"
                ).value;

            const response = await fetch(
                "/transfer",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            TOKEN
                    },

                    body: JSON.stringify({
                        receiver,
                        amount
                    })
                }
            );

            const data =
                await response.json();

            if(response.ok){

                alert(data.message);

                loadBalance();
                loadHistory();

            }else{

                alert(data.error);
            }
        }


        // =====================================
        // HISTORY
        // =====================================

        async function loadHistory() {

            const response = await fetch(
                "/history",
                {
                    headers:{
                        "Authorization":
                            TOKEN
                    }
                }
            );

            const data =
                await response.json();

            if(response.ok){

                const historyDiv =
                    document.getElementById(
                        "history"
                    );

                historyDiv.innerHTML = "";

                if(data.length === 0){

                    historyDiv.innerHTML =
                        "<p>Sem transações</p>";

                    return;
                }

                data.forEach(item => {

                    historyDiv.innerHTML += `

                        <div>

                            <p>
                                ${item.sender}
                                →
                                ${item.receiver}
                            </p>

                            <p>
                                ${item.amount} AKZ
                            </p>

                            <small>
                                ${item.date}
                            </small>

                        </div>
                    `;
                });
            }
        }

    </script>

</body>

</html>
