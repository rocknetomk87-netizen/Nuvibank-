<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NUVIBANK V10</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#06006d;
    color:white;
    padding:30px;
}

.logo{
    font-size:70px;
    font-weight:bold;
    margin-top:20px;
}

.card{
    background:#3b36a0;
    padding:35px;
    border-radius:40px;
    margin-top:40px;
}

h1{
    font-size:40px;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:25px;
    border:none;
    border-radius:30px;
    margin-top:20px;
    font-size:20px;
    background:#7f84df;
    color:white;
}

input::placeholder{
    color:#555;
}

button{
    width:100%;
    padding:25px;
    border:none;
    border-radius:40px;
    margin-top:25px;
    font-size:24px;
    font-weight:bold;
    color:white;
    background:linear-gradient(90deg,#8a2be2,#ff4da6);
}

.history-item{
    margin-top:15px;
    background:#5a56c0;
    padding:15px;
    border-radius:20px;
}

</style>
</head>

<body>

<div style="font-size:70px;">🏦</div>

<div class="logo">
NUVIBANK V10
</div>

<div class="card">
<h1>Servidor Online</h1>
<p style="font-size:25px;">
Sistema financeiro operacional.
</p>
</div>

<div class="card">

<h1>Criar Conta</h1>

<input type="text" id="register_name" placeholder="Nome">

<input type="password" id="register_password" placeholder="Password">

<button onclick="register()">
Criar Conta
</button>

</div>

<div class="card">

<h1>Login</h1>

<input type="text" id="login_name" placeholder="Nome">

<input type="password" id="login_password" placeholder="Password">

<button onclick="login()">
Entrar
</button>

</div>

<div class="card">

<h1>Conta</h1>

<div id="account">
Nenhum utilizador conectado
</div>

</div>

<div class="card">

<h1>Transferir</h1>

<input type="text" id="receiver" placeholder="Destinatário">

<input type="number" id="amount" placeholder="Valor">

<button onclick="transfer()">
Transferir
</button>

</div>

<div class="card">

<h1>Histórico</h1>

<div id="history">
Sem transações
</div>

</div>

<script>

let token = ""

async function register(){

    const username =
    document.getElementById("register_name").value

    const password =
    document.getElementById("register_password").value

    const response = await fetch("/register",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username,
            password
        })
    })

    const data = await response.json()

    alert(data.message)
}

async function login(){

    const username =
    document.getElementById("login_name").value

    const password =
    document.getElementById("login_password").value

    const response = await fetch("/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username,
            password
        })
    })

    const data = await response.json()

    if(data.token){

        token = data.token

        alert("Login realizado")

        await loadAccount()

        await loadHistory()

        window.scrollTo({
            top:document.body.scrollHeight,
            behavior:"smooth"
        })

    }else{

        alert(data.message)
    }
}

async function loadAccount(){

    const response = await fetch("/balance",{
        headers:{
            "Authorization":"Bearer " + token
        }
    })

    const data = await response.json()

    document.getElementById("account").innerHTML = `
    <p style="font-size:25px;">
    Utilizador: ${data.username}
    </p>

    <p style="font-size:25px;">
    Saldo: ${data.balance} KZ
    </p>
    `
}

async function transfer(){

    if(token === ""){
        alert("Faça login primeiro")
        return
    }

    const receiver =
    document.getElementById("receiver").value

    const amount =
    document.getElementById("amount").value

    const response = await fetch("/transfer",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
        },
        body:JSON.stringify({
            receiver,
            amount
        })
    })

    const data = await response.json()

    alert(data.message)

    await loadAccount()

    await loadHistory()
}

async function loadHistory(){

    const response = await fetch("/history",{
        headers:{
            "Authorization":"Bearer " + token
        }
    })

    const data = await response.json()

    let html = ""

    if(data.history.length === 0){

        html = "Sem transações"

    }else{

        data.history.forEach(item => {

            html += `
            <div class="history-item">

            <p>
            Para: ${item.receiver}
            </p>

            <p>
            Valor: ${item.amount} KZ
            </p>

            </div>
            `
        })
    }

    document.getElementById("history").innerHTML = html
}

</script>

</body>
</html>
